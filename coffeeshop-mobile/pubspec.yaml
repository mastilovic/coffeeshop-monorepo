name: coffeeshop_mobile
description: "CoffeeShop mobile app - browse coffee shops, events, make reservations"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Auth
  flutter_secure_storage: ^9.2.4
  web: ^1.1.1

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # UI
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  material_design_icons_flutter: ^7.0.1

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.3
  freezed: ^2.5.8

  # Testing
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0
  coverage: ^1.15.1

flutter:
  uses-material-design: true
