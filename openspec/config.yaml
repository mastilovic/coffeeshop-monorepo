schema: spec-driven

context: |
  Development follows strict Test-Driven Development.
  All behavior changes must follow Red -> Green -> Refactor.
  Requirements must be testable and expressed using Given/When/Then.
  Never implement functionality before a failing test exists.
  Preserve existing architecture and conventions.
  Never mark unverified tasks as complete.

rules:
  specs:
    - Every requirement must have testable acceptance scenarios.
    - Include positive, negative, and boundary scenarios.
  tasks:
    - Every behavior-changing task must include a test-first implementation step.
    - Separate unit, integration, and end-to-end testing where appropriate.
    - Keep tasks small and independently verifiable.

operations:
  apply:
    guidance:
      - Follow strict Red -> Green -> Refactor for each behavior.
      - Run tests after every implementation and refactoring step.
      - Never mark a task complete without verification.
  archive:
    guidance:
      - Verify all requirements against the implementation.
      - Ensure all tests pass before archiving.
